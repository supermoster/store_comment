version: '3.8'

services:
  # ============ MySQL ============
  mysql:
    image: mysql:5.7
    container_name: hmdp-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: hmdp
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    # ==== 资源限制 ====
    deploy:
      resources:
        limits:
          memory: 512M      # MySQL 最多用 512M
    # ==== MySQL 配置：限制日志 & 连接数 ====
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=100
      --expire_logs_days=3
      --max_binlog_size=100M
      --innodb_buffer_pool_size=128M
      --innodb_log_file_size=64M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============ Redis ============
  redis:
    image: redis:7-alpine
    container_name: hmdp-redis
    restart: always
    # ==== 关闭持久化（开发环境不需要，大幅减少磁盘 I/O）====
    command: >
      redis-server
      --requirepass 123456
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "6379:6379"
    # ==== 资源限制 ====
    deploy:
      resources:
        limits:
          memory: 300M
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============ RabbitMQ ============
  rabbitmq:
    image: rabbitmq:3.9-management-alpine
    container_name: hmdp-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: rabbitmq
      # RabbitMQ 内存上限（绝对值）
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: "0.4"   # 用 40% 就触发流控
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    # ==== 资源限制 ====
    deploy:
      resources:
        limits:
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============ 应用 ============
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hmdp-app
    restart: always
    ports:
      - "8081:8081"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: 123456
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: rabbitmq
      RABBITMQ_PASSWORD: rabbitmq
      # 调小 JVM 堆，给系统和其他容器留更多内存
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    # ==== 资源限制 ====
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data: