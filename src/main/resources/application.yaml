server:
  port: 8081
  tomcat:
    threads:
      max: 500        # Tomcat 最大线程数（默认200，高并发下会排队）
      min-spare: 50
    accept-count: 800 # TCP accept 队列深度
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      maximum-pool-size: 50
  rabbitmq:
    addresses: ${RABBITMQ_HOST:192.168.150.100}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:rabbitmq}
    password: ${RABBITMQ_PASSWORD:rabbitmq}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual  # 手动确认模式
        prefetch: 50             # 增大预取数，减少网络往返
        concurrency: 8            # 消费者并发数
        max-concurrency: 16       # 最大并发数
    publisher-confirm-type: correlated  # 发布者确认类型
    channel-rpc-timeout: 5000     # 通道RPC超时
    cache:
      channel:
        size: 50                  # 增大通道缓存数

  redis:
    host: ${REDIS_HOST:192.168.150.100}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:123456}
    lettuce:
      pool:
        enabled: true          # 显式开启连接池（必加，否则 pool 配置被忽略）
        max-active: 200
        max-idle: 100
        min-idle: 20
        time-between-eviction-runs: 10s
      shutdown-timeout: 100ms
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: info      # 关闭 DEBUG，高并发下日志 IO 是巨大瓶颈
    root: warn

management: # 健康点检测
  endpoints:
    web:
      exposure:
        include: health,info,metrics # 暴露健康点、应用信息、指标 http://localhost:8081/actuator/health
info:
  app:
    name: hmdp
    version: 1.0.0
    description: 本地生活服务平台