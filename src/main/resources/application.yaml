server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 50
  rabbitmq:
    addresses: 192.168.150.100
    port: 5672
    username: rabbitmq
    password: rabbitmq
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual  # 手动确认模式
        prefetch: 100             # 增大预取数，减少网络往返
        concurrency: 8            # 消费者并发数
        max-concurrency: 16       # 最大并发数
    publisher-confirm-type: correlated  # 发布者确认类型
    channel-rpc-timeout: 5000     # 通道RPC超时
    cache:
      channel:
        size: 50                  # 增大通道缓存数

  redis:
    host: 192.168.150.100
    port: 6379
    password: 123456
    lettuce:
      pool:
        max-active: 60
        max-idle: 30
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug

management: # 健康点检测
  endpoints:
    web:
      exposure:
        include: health,info,metrics # 暴露健康点、应用信息、指标 http://localhost:8081/actuator/health
info:
  app:
    name: hmdp
    version: 1.0.0
    description: 本地生活服务平台